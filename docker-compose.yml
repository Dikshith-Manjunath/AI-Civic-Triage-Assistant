version: "3.9"

services:
  # ── ClickHouse Data Warehouse ──────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: civicflow-clickhouse
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # Native
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./servers/db/init:/docker-entrypoint-initdb.d
    environment:
      CLICKHOUSE_DB: civicflow
      CLICKHOUSE_USER: civicflow
      CLICKHOUSE_PASSWORD: civicflow_secret
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - civicnet

  # ── MinIO Object Storage ───────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: civicflow-minio
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000"   # S3 API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: civicflow
      MINIO_ROOT_PASSWORD: civicflow_secret
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - civicnet

  # ── Kafka (Redpanda - lightweight) ────────────────────────────
  redpanda:
    image: redpandadata/redpanda:v24.1.1
    container_name: civicflow-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --smp 1
      - --memory 512M
      - --overprovisioned
    ports:
      - "19092:19092"  # Kafka API
      - "8082:8082"    # Schema Registry
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - civicnet

  # ── Nominatim (Local Geocoding) ────────────────────────────────
  # Uncomment and configure with local OSM data for production:
  # nominatim:
  #   image: mediagis/nominatim:4.4
  #   container_name: civicflow-nominatim
  #   environment:
  #     PBF_URL: https://download.geofabrik.de/asia/india-latest.osm.pbf
  #     REPLICATION_URL: https://download.geofabrik.de/asia/india-updates/
  #   ports:
  #     - "8080:8080"
  #   volumes:
  #     - nominatim_data:/var/lib/nominatim
  #   networks:
  #     - civicnet

  # ── FastAPI Backend ────────────────────────────────────────────
  fastapi:
    build:
      context: ./servers
      dockerfile: Dockerfile
    container_name: civicflow-api
    ports:
      - "8000:8000"
    volumes:
      - ./servers:/app
      - media_uploads:/app/uploads
    env_file:
      - ./servers/.env
    depends_on:
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    networks:
      - civicnet

  # ── Next.js Frontend ───────────────────────────────────────────
  nextjs:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: civicflow-ui
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - fastapi
    networks:
      - civicnet

volumes:
  clickhouse_data:
  minio_data:
  redpanda_data:
  media_uploads:

networks:
  civicnet:
    driver: bridge
