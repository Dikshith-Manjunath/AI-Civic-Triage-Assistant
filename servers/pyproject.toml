[project]
name = "civicflow-server"
version = "0.1.0"
description = "AI Civic Triage System - FastAPI Backend with LangGraph Agent"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # ── Web Framework ──
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",

    # ── Data & Validation ──
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    # ── Kafka ──
    "aiokafka>=0.11.0",

    # ── ClickHouse ──
    "clickhouse-connect>=0.8.0",

    # ── MinIO / S3 ──
    "minio>=7.2.0",

    # ── AI / ML ──
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-community>=0.3.0",
    "sentence-transformers>=3.3.0",
    "openai>=1.50.0",

    # ── NLP ──
    "spacy>=3.8.0",

    # ── Document Processing ──
    "pypdf>=5.0.0",
    "pillow>=10.4.0",

    # ── Geocoding ──
    "geopy>=2.4.0",

    # ── Utilities ──
    "python-dotenv>=1.0.0",
    "structlog>=24.4.0",
    "uuid7>=0.1.0",
]

[project.optional-dependencies]
audio = [
    # Faster Whisper implementation (no numba/llvmlite)
    "faster-whisper>=1.1.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
