[project]
name = "civicflow-server"
version = "0.2.0"
description = "AI Civic Triage System – Phase 1-3 (Core + Multimodal + Embeddings)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # ── Web Framework ──
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    # ── Data & Validation ──
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # ── ClickHouse ──
    "clickhouse-connect>=0.8.0",
    # ── MinIO / S3 ──
    "minio>=7.2.0",
    # ── Document Processing ──
    "pypdf>=5.0.0",
    # ── AI / LLM ──
    "google-genai>=1.0.0",
    # ── Embeddings ──
    "sentence-transformers>=3.0.0",
    # ── Utilities ──
    "python-dotenv>=1.0.0",
    "pynacl>=1.6.2",
]

[project.optional-dependencies]
audio = [
    "faster-whisper>=1.1.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
