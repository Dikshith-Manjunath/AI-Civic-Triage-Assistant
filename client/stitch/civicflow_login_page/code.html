<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CivicFlow - Secure Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "primary": "#1a2a47",
                "background-light": "#f6f7f8",
                "background-dark": "#14181e",
              },
              fontFamily: {
                "display": ["Inter"]
              },
              borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
            },
          },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display min-h-screen flex flex-col">
<!-- Background Decoration -->
<div class="fixed inset-0 z-0 opacity-10 pointer-events-none overflow-hidden">
<div class="absolute -top-24 -left-24 w-96 h-96 bg-primary rounded-full blur-3xl"></div>
<div class="absolute bottom-0 right-0 w-[500px] h-[500px] bg-primary/20 rounded-full blur-[120px]"></div>
</div>
<main class="relative z-10 flex-1 flex flex-col items-center justify-center p-4">
<div class="w-full max-w-[440px] bg-white dark:bg-slate-900 rounded-xl shadow-xl border border-slate-200 dark:border-slate-800 overflow-hidden">
<!-- Card Header -->
<div class="pt-8 pb-6 px-8 flex flex-col items-center">
<div class="flex items-center gap-3 mb-4">
<div class="size-10 flex items-center justify-center bg-primary rounded-lg text-white">
<svg class="size-6" fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M24 45.8096C19.6865 45.8096 15.4698 44.5305 11.8832 42.134C8.29667 39.7376 5.50128 36.3314 3.85056 32.3462C2.19985 28.361 1.76794 23.9758 2.60947 19.7452C3.451 15.5145 5.52816 11.6284 8.57829 8.5783C11.6284 5.52817 15.5145 3.45101 19.7452 2.60948C23.9758 1.76795 28.361 2.19986 32.3462 3.85057C36.3314 5.50129 39.7376 8.29668 42.134 11.8833C44.5305 15.4698 45.8096 19.6865 45.8096 24L24 24L24 45.8096Z" fill="currentColor"></path>
</svg>
</div>
<h1 class="text-2xl font-bold text-slate-900 dark:text-slate-100 tracking-tight">CivicFlow</h1>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-semibold">Official Portal Login</h2>
<p class="text-slate-500 dark:text-slate-400 text-sm mt-1">Enter your credentials to access the dashboard</p>
</div>
<!-- Login Form -->
<div class="px-8 pb-10">
<form action="#" class="space-y-5">
<!-- Authority Dropdown -->
<div class="flex flex-col gap-1.5">
<label class="text-sm font-medium text-slate-700 dark:text-slate-300">Select Authority</label>
<div class="relative">
<select class="appearance-none w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-slate-100 rounded-lg px-4 py-3 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all">
<option disabled="" selected="" value="">Choose your department</option>
<option value="bbmp">BBMP (Bruhat Bengaluru Mahanagara Palike)</option>
<option value="bwssb">BWSSB (Bangalore Water Supply &amp; Sewerage Board)</option>
<option value="bescom">BESCOM (Bangalore Electricity Supply Company)</option>
<option value="bmtc">BMTC (Bangalore Metropolitan Transport Corp)</option>
<option value="gba">GBA (Governing Body Authority)</option>
<option value="bda">BDA (Bangalore Development Authority)</option>
</select>
<div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-500">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<!-- Email/Username -->
<div class="flex flex-col gap-1.5">
<label class="text-sm font-medium text-slate-700 dark:text-slate-300">Username/Email</label>
<div class="relative">
<input class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-slate-100 rounded-lg px-4 py-3 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all" placeholder="e.g. johndoe@karnataka.gov.in" type="text"/>
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-1.5">
<div class="flex justify-between items-center">
<label class="text-sm font-medium text-slate-700 dark:text-slate-300">Password</label>
</div>
<div class="relative">
<input class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-slate-100 rounded-lg px-4 py-3 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<div class="flex items-center justify-end">
<button class="text-sm font-medium text-primary hover:underline" type="button">Forgot Password?</button>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary hover:bg-primary/90 text-white font-semibold py-3.5 rounded-lg shadow-md shadow-primary/20 transition-all flex items-center justify-center gap-2" type="submit">
<span class="material-symbols-outlined text-lg">lock</span>
                        Secure Login
                    </button>
</form>
</div>
<!-- Warning Banner -->
<div class="bg-slate-50 dark:bg-slate-800/50 border-t border-slate-200 dark:border-slate-800 p-4">
<div class="flex items-start gap-3">
<span class="material-symbols-outlined text-amber-600 shrink-0">warning</span>
<p class="text-[11px] leading-relaxed text-slate-600 dark:text-slate-400 uppercase tracking-wider font-semibold">
                        Warning: Unauthorized access is prohibited. All activity is monitored and recorded by the Department of e-Governance.
                    </p>
</div>
</div>
</div>
<!-- Branding Footer -->
<footer class="mt-8 flex flex-col items-center gap-6">
<div class="flex items-center gap-8 opacity-70 grayscale hover:grayscale-0 transition-all">
<img alt="Government of Karnataka Seal" class="h-14 w-auto" data-alt="Official Seal of the Government of Karnataka" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBTnKg_NZP0B9MhibZaxUaIOYq36Df0mW2_fQr4J9GOQwzeeZFBFdg4oI1loU_4GebhCKe_uNnDp7bMmdoXKFVKqUfs1dFYFOCj7LWsd3gUisxScPQnCO7yYZux9PYbW6MVi9DlDiI4fnQ1lfURbXiTHA-l2koaG0krpKJw5OA2mJjWsne2IHEUYGzDKPWn8ngF5NJCUo0B7fIddaVufsyZ8j14olQ75bDBNLEreHeg4DUKwItYuPECLD1HRkqmlt9Z7i0G6FJt2os"/>
<div class="h-10 w-px bg-slate-300 dark:bg-slate-700"></div>
<div class="flex flex-col items-start leading-none">
<span class="text-slate-900 dark:text-slate-100 font-bold text-xl tracking-tight">Bengaluru</span>
<span class="text-slate-500 dark:text-slate-400 text-[10px] uppercase font-bold tracking-[0.2em] mt-1">Smart City Initiative</span>
</div>
</div>
<p class="text-slate-400 dark:text-slate-500 text-xs">
                © 2024 CivicFlow | Government of Karnataka
            </p>
</footer>
</main>
</body></html>
